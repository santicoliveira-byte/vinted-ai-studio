<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="lens_outer_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00A8B5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#090D0F" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="lens_ring_grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38E1ED"/>
      <stop offset="50%" stop-color="#007782"/>
      <stop offset="100%" stop-color="#0F2B30"/>
    </linearGradient>

    <radialGradient id="glass_reflection" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A5F3FC" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#00A8B5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#041215" stop-opacity="0.95"/>
    </radialGradient>

    <linearGradient id="sparkle_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="#00A8B5"/>
    </linearGradient>

    <filter id="studio_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- iOS Squircle Background -->
  <rect width="512" height="512" rx="115" fill="#090D0F"/>
  <rect x="6" y="6" width="500" height="500" rx="109" stroke="url(#lens_ring_grad)" stroke-width="5" opacity="0.6"/>
  <circle cx="256" cy="256" r="220" fill="url(#lens_outer_glow)"/>

  <!-- Camera Body & Focus Rings -->
  <!-- Outer Ridged Bezel -->
  <circle cx="256" cy="256" r="175" fill="#111B1E" stroke="url(#lens_ring_grad)" stroke-width="8"/>
  <circle cx="256" cy="256" r="150" stroke="#00A8B5" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Inner Metallic Ring -->
  <circle cx="256" cy="256" r="135" fill="#0B1518" stroke="#38E1ED" stroke-width="6"/>

  <!-- Lens Glass Element -->
  <circle cx="256" cy="256" r="115" fill="url(#glass_reflection)" filter="url(#studio_glow)"/>

  <!-- Glass Light Reflection Arc -->
  <path d="M185 185 A 100 100 0 0 1 315 160" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.5"/>

  <!-- Iconic V inside Lens Aperture -->
  <g transform="translate(256, 256)">
    <path d="M-45 -35 L0 45 L45 -35" stroke="url(#sparkle_grad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="0" cy="5" r="8" fill="#38E1ED" opacity="0.9"/>
  </g>

  <!-- Giant Studio AI Flash Star (Top Right of Lens) -->
  <g transform="translate(370, 140)">
    <circle cx="0" cy="0" r="30" fill="#38E1ED" opacity="0.3" filter="url(#studio_glow)"/>
    <path d="M0 -55 C0 -16 16 0 55 0 C16 0 0 16 0 55 C0 16 -16 0 -55 0 C-16 0 0 -16 0 -55 Z" fill="url(#sparkle_grad)"/>
    <circle cx="0" cy="0" r="14" fill="#FFFFFF"/>
  </g>

  <!-- Secondary Sensor Star -->
  <g transform="translate(145, 365) scale(0.4)">
    <path d="M0 -50 C0 -15 15 0 50 0 C15 0 0 15 0 50 C0 15 -15 0 -50 0 C-15 0 0 -15 0 -50 Z" fill="url(#sparkle_grad)" opacity="0.8"/>
  </g>
</svg>

<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="v_ambient_glow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#00A8B5" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#090D0F" stop-opacity="0"/>
    </radialGradient>

    <!-- Left Wing of 3D V -->
    <linearGradient id="v_left_grad" x1="130" y1="120" x2="260" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#72EEF7"/>
      <stop offset="50%" stop-color="#00A8B5"/>
      <stop offset="100%" stop-color="#00636B"/>
    </linearGradient>

    <!-- Right Wing of 3D V -->
    <linearGradient id="v_right_grad" x1="380" y1="120" x2="250" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38E1ED"/>
      <stop offset="60%" stop-color="#007782"/>
      <stop offset="100%" stop-color="#053338"/>
    </linearGradient>

    <!-- Center Fold Highlight -->
    <linearGradient id="fold_highlight" x1="256" y1="200" x2="256" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00A8B5" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sparkle_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="#00A8B5"/>
    </linearGradient>

    <filter id="neon_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- iOS Squircle Background -->
  <rect width="512" height="512" rx="115" fill="#090D0F"/>
  <rect x="6" y="6" width="500" height="500" rx="109" stroke="#00A8B5" stroke-width="4" stroke-opacity="0.4"/>
  <circle cx="256" cy="270" r="210" fill="url(#v_ambient_glow)"/>

  <!-- High-End 3D Geometric "V" Ribbon Motif -->
  <g filter="url(#neon_shadow)">
    <!-- Right Facet (Darker / Depth) -->
    <path d="M256 395 L345 160 C352 142 372 132 390 138 C407 145 415 165 407 182 L292 412 C278 440 234 440 220 412 L105 182 C97 165 105 145 122 138 C140 132 160 142 167 160 L256 395 Z" fill="url(#v_right_grad)"/>

    <!-- Left Facet (Light / Luminous) -->
    <path d="M105 182 L220 412 C234 440 278 440 292 412 L256 395 L167 160 C160 142 140 132 122 138 C105 145 97 165 105 182 Z" fill="url(#v_left_grad)"/>

    <!-- Inner Core Crest Highlight -->
    <path d="M256 385 L320 215" stroke="url(#fold_highlight)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Top Right AI Intelligence Crystal Sparkle -->
  <g transform="translate(385, 125)">
    <circle cx="0" cy="0" r="25" fill="#38E1ED" opacity="0.25" filter="url(#neon_shadow)"/>
    <path d="M0 -45 C0 -12 12 0 45 0 C12 0 0 12 0 45 C0 12 -12 0 -45 0 C-12 0 0 -12 0 -45 Z" fill="url(#sparkle_grad)"/>
    <circle cx="0" cy="0" r="10" fill="#FFFFFF"/>
  </g>
</svg>

<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bag_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00A8B5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#090D0F" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bag_grad" x1="120" y1="170" x2="390" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38E1ED"/>
      <stop offset="45%" stop-color="#00A8B5"/>
      <stop offset="100%" stop-color="#005B63"/>
    </linearGradient>

    <linearGradient id="handle_grad" x1="180" y1="80" x2="330" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="#00A8B5"/>
    </linearGradient>

    <linearGradient id="sparkle_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="#00A8B5"/>
    </linearGradient>

    <filter id="bag_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- iOS Squircle Background -->
  <rect width="512" height="512" rx="115" fill="#090D0F"/>
  <rect x="6" y="6" width="500" height="500" rx="109" stroke="#00A8B5" stroke-width="4" stroke-opacity="0.4"/>
  <circle cx="256" cy="270" r="220" fill="url(#bag_glow)"/>

  <!-- Shopping Tote Bag -->
  <g filter="url(#bag_shadow)">
    <!-- Curved Handles -->
    <path d="M195 190 C195 105 317 105 317 190" stroke="url(#handle_grad)" stroke-width="14" stroke-linecap="round" fill="none"/>

    <!-- Bag Main Trapezoid Body -->
    <path d="M140 190 L372 190 C386 190 398 202 396 216 L376 400 C374 416 360 428 344 428 L168 428 C152 428 138 416 136 400 L116 216 C114 202 126 190 140 190 Z" fill="url(#bag_grad)"/>

    <!-- Top Lip / Fold of the Bag -->
    <path d="M136 190 L376 190 L372 215 L140 215 Z" fill="#04262A" opacity="0.3"/>

    <!-- Stylized V with Star Center on Bag -->
    <path d="M205 270 L256 345 L307 270" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="256" cy="290" r="10" fill="#FFFFFF"/>
  </g>

  <!-- Top Right AI Intelligence Star -->
  <g transform="translate(375, 125)">
    <path d="M0 -45 C0 -12 12 0 45 0 C12 0 0 12 0 45 C0 12 -12 0 -45 0 C-12 0 0 -12 0 -45 Z" fill="url(#sparkle_grad)"/>
    <circle cx="0" cy="0" r="10" fill="#FFFFFF"/>
  </g>

  <!-- Small Ambient Sparkle -->
  <g transform="translate(125, 360) scale(0.5)">
    <path d="M0 -45 C0 -12 12 0 45 0 C12 0 0 12 0 45 C0 12 -12 0 -45 0 C-12 0 0 -12 0 -45 Z" fill="url(#sparkle_grad)" opacity="0.8"/>
  </g>
</svg>

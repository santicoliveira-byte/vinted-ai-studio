<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="box_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00A8B5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#090D0F" stop-opacity="0"/>
    </radialGradient>

    <!-- Isometric Box Gradients -->
    <linearGradient id="box_top" x1="160" y1="160" x2="350" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38E1ED"/>
      <stop offset="100%" stop-color="#00A8B5"/>
    </linearGradient>

    <linearGradient id="box_left" x1="150" y1="240" x2="256" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00A8B5"/>
      <stop offset="100%" stop-color="#005B63"/>
    </linearGradient>

    <linearGradient id="box_right" x1="256" y1="240" x2="370" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#007782"/>
      <stop offset="100%" stop-color="#04262A"/>
    </linearGradient>

    <!-- Lightning / Speed Gradient -->
    <linearGradient id="bolt_grad" x1="200" y1="100" x2="300" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <filter id="box_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- iOS Squircle Background -->
  <rect width="512" height="512" rx="115" fill="#090D0F"/>
  <rect x="6" y="6" width="500" height="500" rx="109" stroke="#00A8B5" stroke-width="4" stroke-opacity="0.4"/>
  <circle cx="256" cy="270" r="220" fill="url(#box_glow)"/>

  <!-- 3D Isometric Shipping Parcel Box -->
  <g filter="url(#box_shadow)" transform="translate(0, 30)">
    <!-- Top Face -->
    <polygon points="256,150 375,215 256,280 137,215" fill="url(#box_top)"/>

    <!-- Left Face -->
    <polygon points="137,215 256,280 256,410 137,345" fill="url(#box_left)"/>

    <!-- Right Face -->
    <polygon points="256,280 375,215 375,345 256,410" fill="url(#box_right)"/>

    <!-- Tape Lines -->
    <polygon points="244,157 268,143 268,273 244,287" fill="#A5F3FC" opacity="0.4"/>
    <polygon points="244,287 268,273 268,403 244,417" fill="#A5F3FC" opacity="0.3"/>
  </g>

  <!-- Electric Speed Lightning Bolt & AI Burst Rising from Box -->
  <g filter="url(#box_shadow)">
    <!-- Lightning Bolt -->
    <path d="M275 80 L195 240 L260 240 L235 340 L325 185 L260 185 L290 80 Z" fill="url(#bolt_grad)" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Sparkle Stars -->
  <g transform="translate(390, 110)">
    <path d="M0 -35 C0 -10 10 0 35 0 C10 0 0 10 0 35 C0 10 -10 0 -35 0 C-10 0 0 -10 0 -35 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="8" fill="#A5F3FC"/>
  </g>

  <g transform="translate(130, 160) scale(0.6)">
    <path d="M0 -35 C0 -10 10 0 35 0 C10 0 0 10 0 35 C0 10 -10 0 -35 0 C-10 0 0 -10 0 -35 Z" fill="#A5F3FC" opacity="0.8"/>
  </g>
</svg>
